[project]
name = "sudoku"
version = "0.1.0"
description = "現代扁平風格的數獨桌面遊戲"
authors = [
    { name = "ChengHsien Yang", email = "chenghyang2001@yahoo.com" }
]
requires-python = ">=3.12"
dependencies = [
    "customtkinter>=6.0.0",
    "platformdirs>=4.12.3",
]

[project.scripts]
sudoku = "sudoku.app:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=9.1.1",
]

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
